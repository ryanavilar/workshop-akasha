apiVersion: v1
kind: Namespace
metadata:
  name: traefik-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik-system
spec:
  interval: 1h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik-system
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "39.0.8"
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    deployment:
      kind: DaemonSet
    hostNetwork: true
    ingressRoute:
      dashboard:
        enabled: false
    securityContext:
      capabilities:
        add:
          - NET_BIND_SERVICE
        drop:
          - ALL
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    podSecurityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
    ports:
      traefik:
        expose:
          default: false
        hostPort: 9000
        port: 9000
      web:
        hostPort: 80
        port: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        hostPort: 443
        port: 443
    service:
      enabled: false
    updateStrategy:
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    additionalArguments:
      - "--providers.kubernetesingressnginx"
