apiVersion: v1
kind: Namespace
metadata:
  name: openebs
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openebs-lvm
  namespace: openebs
spec:
  interval: 1h
  url: https://openebs.github.io/lvm-localpv
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs-lvm
  namespace: openebs
spec:
  interval: 1h
  chart:
    spec:
      chart: lvm-localpv
      version: "1.8.1"
      sourceRef:
        kind: HelmRepository
        name: openebs-lvm
  values:
    lvmNode:
      tolerations:
        - operator: Exists
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-lvm
provisioner: local.csi.openebs.io
parameters:
  storage: lvm
  volgroup: openebs-vg
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: openebs-vg-init
  namespace: openebs
spec:
  selector:
    matchLabels:
      app: openebs-vg-init
  template:
    metadata:
      labels:
        app: openebs-vg-init
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: vg-init
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              for i in 1 2 3; do apk add --no-cache lvm2 && break; echo "retry $i"; sleep 5; done
              if ! command -v pvcreate; then echo 'ERROR: lvm2 not installed'; sleep infinity; fi
              if [ ! -b /dev/sdb1 ]; then echo 'No /dev/sdb1, skipping'; sleep infinity; fi
              if vgs openebs-vg >/dev/null 2>&1; then echo 'VG openebs-vg already exists'; sleep infinity; fi
              echo 'Creating VG on /dev/sdb1'
              pvcreate /dev/sdb1 && vgcreate openebs-vg /dev/sdb1 && echo 'VG created'
              sleep infinity
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
