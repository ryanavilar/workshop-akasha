apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: project-zot
  namespace: flux-system
spec:
  interval: 24h
  url: https://zotregistry.dev/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: zot-system
spec:
  interval: 1h
  chart:
    spec:
      chart: zot
      version: "0.1.102"
      sourceRef:
        kind: HelmRepository
        name: project-zot
        namespace: flux-system
  values:
    strategy:
      type: Recreate
    mountConfig: true
    configFiles:
      config.json: |
        {
          "storage": {
            "rootDirectory": "/var/lib/registry",
            "gc": true,
            "gcDelay": "1h",
            "gcInterval": "6h",
            "retention": {
              "delay": "24h",
              "policies": [
                {
                  "repositories": ["**"],
                  "deleteReferrers": true,
                  "deleteUntagged": true,
                  "keepTags": [
                    {"patterns": ["^v\\d+"], "mostRecentlyPushedCount": 10},
                    {"patterns": [".*"], "mostRecentlyPushedCount": 3}
                  ]
                }
              ]
            }
          },
          "http": {"address": "0.0.0.0", "port": "5000"},
          "log": {"level": "info"},
          "extensions": {
            "sync": {
              "registries": [
                {
                  "urls": ["https://registry-1.docker.io"],
                  "content": [
                    {"prefix": "vikunja/**"},
                    {"prefix": "library/**"},
                    {"prefix": "longhornio/**"},
                    {"prefix": "myoung34/**"},
                    {"prefix": "curlimages/**"}
                  ],
                  "onDemand": true,
                  "tlsVerify": true
                },
                {
                  "urls": ["https://ghcr.io"],
                  "content": [
                    {"prefix": "cloudnative-pg/**"}
                  ],
                  "onDemand": true,
                  "tlsVerify": true
                }
              ]
            }
          }
        }
    persistence: true
    pvc:
      create: true
      storage: 20Gi
      storageClassName: longhorn
    service:
      type: NodePort
      port: 5000
    ingress:
      enabled: true
      className: traefik
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.middlewares: default-hsts@kubernetescrd
        cert-manager.io/cluster-issuer: letsencrypt
      hosts:
        - host: zot-workshop-akasha.cl8s.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: zot-workshop-tls
          hosts:
            - zot-workshop-akasha.cl8s.dev
