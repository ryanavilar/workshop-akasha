name: Build and Push Vikunja

on:
  push:
    branches: [main]
    paths:
      - "apps/vikunja/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, workshop]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner image ships a containers.conf with a [machine] section its
      # older buildah can't parse, causing warning spam. Built-in defaults apply.
      - name: Silence buildah containers.conf warnings
        run: printf '' > /usr/share/containers/containers.conf || true

      - name: Build image
        run: |
          buildah bud \
            --format docker \
            -t zot-workshop-akasha.cl8s.dev/vikunja/vikunja:${{ github.sha }} \
            -t zot-workshop-akasha.cl8s.dev/vikunja/vikunja:latest \
            apps/vikunja/

      - name: Push to Zot
        run: |
          buildah push --tls-verify=false \
            zot-workshop-akasha.cl8s.dev/vikunja/vikunja:${{ github.sha }}
          buildah push --tls-verify=false \
            zot-workshop-akasha.cl8s.dev/vikunja/vikunja:latest
